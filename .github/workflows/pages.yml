# Publishes MoneyMap to GitHub Pages.
# `enablement: true` switches Pages on the first time this runs, so the site
# appears without anyone touching repository settings.
name: Deploy MoneyMap to Pages

on:
  push:
    branches:
      - main
      - claude/multi-currency-finance-tracker-bchig3
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling a
# half-finished publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect the static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          # Pages runs the upload through Jekyll otherwise, which skips folders
          # beginning with an underscore.
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
